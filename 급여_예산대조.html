<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>급여 예산대조</title>
<script src="libs/pdf.min.js"></script>
<style>
  :root{
    --navy:#152a4a;
    --navy-deep:#0c1b32;
    --steel:#4a5b7a;
    --line:#dfe4ee;
    --bg:#f4f6fb;
    --card:#ffffff;
    --accent:#c8892e;
    --good:#2f7d5c;
    --bad:#b3432b;
    --text:#1b2333;
    --sub:#6b7690;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:32px 20px 80px;
  }
  .wrap{max-width:960px;margin:0 auto;}
  header{margin-bottom:28px;}
  header h1{
    font-size:22px;
    margin:0 0 6px;
    letter-spacing:-0.02em;
    color:var(--navy-deep);
  }
  header p{margin:0;color:var(--sub);font-size:13.5px;line-height:1.6;}

  .upload-zone{
    border:1.5px dashed #b7c1d6;
    background:var(--card);
    border-radius:14px;
    padding:34px 24px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .upload-zone.drag{border-color:var(--navy);background:#eef1fa;}
  .upload-zone svg{width:30px;height:30px;color:var(--steel);margin-bottom:10px;}
  .upload-zone .main-txt{font-size:14.5px;font-weight:600;color:var(--navy-deep);}
  .upload-zone .sub-txt{font-size:12.5px;color:var(--sub);margin-top:4px;}
  input[type=file]{display:none;}

  .status{
    display:none;
    align-items:center;
    gap:10px;
    margin-top:14px;
    font-size:13px;
    color:var(--steel);
  }
  .status.show{display:flex;}
  .spinner{
    width:14px;height:14px;border-radius:50%;
    border:2px solid #cfd6e6;border-top-color:var(--navy);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .error-box{
    display:none;
    margin-top:16px;
    background:#fbeeec;
    border:1px solid #eecbc3;
    color:var(--bad);
    padding:14px 16px;
    border-radius:10px;
    font-size:13px;
    line-height:1.6;
    white-space:pre-line;
  }
  .error-box.show{display:block;}

  .file-bar{
    display:none;
    align-items:center;
    justify-content:space-between;
    margin-top:16px;
    padding:10px 14px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:13px;
  }
  .file-bar.show{display:flex;}
  .file-bar .name{color:var(--navy-deep);font-weight:600;}
  .file-bar button{
    border:none;background:none;color:var(--steel);
    font-size:12.5px;cursor:pointer;text-decoration:underline;
    padding:0;
  }

  .results{display:none;margin-top:30px;}
  .results.show{display:block;}

  .meta-line{
    display:flex;gap:18px;flex-wrap:wrap;
    font-size:12.5px;color:var(--sub);
    margin-bottom:16px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .meta-line b{color:var(--navy-deep);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
    gap:14px;
  }
  .metric{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px;
    position:relative;
    overflow:hidden;
  }
  .metric::before{
    content:"";
    position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--navy);
  }
  .metric.alt::before{background:var(--accent);}
  .metric .label{
    font-size:12.5px;color:var(--sub);font-weight:600;margin-bottom:8px;
  }
  .metric .value{
    font-size:22px;font-weight:700;color:var(--navy-deep);
    font-variant-numeric:tabular-nums;
    letter-spacing:-0.01em;
  }
  .metric .value .won{font-size:14px;font-weight:500;color:var(--sub);margin-left:2px;}
  .metric .formula{
    margin-top:8px;font-size:11.5px;color:var(--sub);
    border-top:1px dashed var(--line);padding-top:8px;
  }

  .toggle-detail{
    margin-top:22px;
    font-size:12.5px;
    color:var(--steel);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:5px;
    user-select:none;
  }
  .toggle-detail svg{width:12px;height:12px;transition:transform .15s ease;}
  .toggle-detail.open svg{transform:rotate(90deg);}

  table.detail{
    display:none;
    width:100%;
    border-collapse:collapse;
    margin-top:12px;
    font-size:12.5px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  table.detail.show{display:table;}
  table.detail th,table.detail td{
    padding:9px 12px;
    text-align:right;
    border-bottom:1px solid var(--line);
    font-variant-numeric:tabular-nums;
  }
  table.detail th:first-child,table.detail td:first-child{text-align:left;}
  table.detail thead th{
    background:#f0f2f8;color:var(--navy-deep);font-weight:700;
    border-bottom:1px solid var(--line);
  }
  table.detail tbody tr:last-child td{border-bottom:none;font-weight:700;background:#f8f9fc;}

  footer{
    margin-top:40px;
    font-size:11.5px;
    color:#9aa4ba;
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>급여 예산대조</h1>
    <p>급여지급 총괄표 PDF를 업로드하면 지급내역 기준 5개 산출값을 자동 계산합니다. (공제내역은 참조하지 않음)</p>
  </header>

  <div id="uploadZone" class="upload-zone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 15V3m0 0L7 8m5-5l5 5"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
    <div class="main-txt">PDF를 여기에 끌어놓거나 클릭해서 선택하세요</div>
    <div class="sub-txt">급여지급 총괄표 형식(월별 동일 양식)</div>
    <input type="file" id="fileInput" accept="application/pdf">
  </div>

  <div class="status" id="statusBar"><div class="spinner"></div><span id="statusText">분석 중...</span></div>
  <div class="error-box" id="errorBox"></div>
  <div class="file-bar" id="fileBar">
    <span class="name" id="fileName"></span>
    <button id="resetBtn">다른 파일 선택</button>
  </div>

  <div class="results" id="results">
    <div class="meta-line" id="metaLine"></div>
    <div class="grid" id="grid"></div>

    <div class="toggle-detail" id="detailToggle">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l8 7-8 7z"/></svg>
      직종별 원본 추출값 보기
    </div>
    <table class="detail" id="detailTable">
      <thead>
        <tr><th>직종</th><th>인원</th><th>초과근무</th><th>초과강의료</th><th>지급합계</th></tr>
      </thead>
      <tbody id="detailBody"></tbody>
    </table>
  </div>

  <footer>모든 계산은 브라우저 안에서만 이루어지며, 파일은 외부로 전송되지 않습니다.</footer>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "libs/pdf.worker.min.js";

const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const statusBar = document.getElementById('statusBar');
const statusText = document.getElementById('statusText');
const errorBox = document.getElementById('errorBox');
const fileBar = document.getElementById('fileBar');
const fileName = document.getElementById('fileName');
const resetBtn = document.getElementById('resetBtn');
const resultsEl = document.getElementById('results');
const metaLine = document.getElementById('metaLine');
const grid = document.getElementById('grid');
const detailToggle = document.getElementById('detailToggle');
const detailTable = document.getElementById('detailTable');
const detailBody = document.getElementById('detailBody');

const ROW_LABELS = ['전임교원','초빙교원','일반직','기술직','계약직','합계'];
const STAFF_LABELS = ['일반직','기술직','계약직'];

uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});
resetBtn.addEventListener('click', () => {
  fileInput.value = '';
  fileBar.classList.remove('show');
  resultsEl.classList.remove('show');
  errorBox.classList.remove('show');
  uploadZone.style.display = '';
});
detailToggle.addEventListener('click', () => {
  detailToggle.classList.toggle('open');
  detailTable.classList.toggle('show');
});

function showError(msg){
  statusBar.classList.remove('show');
  errorBox.textContent = msg;
  errorBox.classList.add('show');
}

async function handleFile(file){
  errorBox.classList.remove('show');
  resultsEl.classList.remove('show');
  if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
    showError('PDF 파일만 업로드할 수 있습니다.');
    return;
  }
  fileName.textContent = file.name;
  fileBar.classList.add('show');
  uploadZone.style.display = 'none';
  statusText.textContent = '파일을 분석하는 중입니다...';
  statusBar.classList.add('show');

  try {
    const buf = await file.arrayBuffer();
    const words = await extractWords(buf);
    const parsed = parseSalaryTable(words);
    renderResults(parsed);
    statusBar.classList.remove('show');
  } catch (err) {
    console.error(err);
    showError('분석에 실패했습니다: ' + err.message + '\n급여지급 총괄표와 동일한 양식의 PDF인지 확인해 주세요.');
  }
}

// ---- PDF text extraction & word reconstruction ----
async function extractWords(arrayBuffer){
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const page = await pdf.getPage(1);
  const content = await page.getTextContent();

  const items = content.items
    .filter(it => it.str && it.str.trim() !== '')
    .map(it => ({
      text: it.str,
      x0: it.transform[4],
      x1: it.transform[4] + it.width,
      y: it.transform[5]
    }));

  // group into lines by y-proximity
  items.sort((a, b) => b.y - a.y || a.x0 - b.x0);
  const lines = [];
  const Y_TOL = 2.2;
  for (const it of items) {
    let line = lines.find(l => Math.abs(l.y - it.y) < Y_TOL);
    if (!line) { line = { y: it.y, items: [] }; lines.push(line); }
    line.items.push(it);
  }

  // merge same-line items into words based on x-gap
  const GAP = 9; // gap larger than intra-header letter-spacing, smaller than column gaps
  const words = [];
  for (const line of lines) {
    line.items.sort((a, b) => a.x0 - b.x0);
    let cur = null;
    for (const it of line.items) {
      if (cur && (it.x0 - cur.x1) < GAP) {
        cur.text += it.text;
        cur.x1 = Math.max(cur.x1, it.x1);
      } else {
        if (cur) words.push(cur);
        cur = { text: it.text, x0: it.x0, x1: it.x1, y: line.y };
      }
    }
    if (cur) words.push(cur);
  }
  return words;
}

// ---- Table structure parsing ----
function parseSalaryTable(words){
  // locate row-group anchors (직종 labels)
  const anchors = {};
  for (const w of words) {
    const t = w.text.replace(/\s+/g, '');
    if (ROW_LABELS.includes(t) && w.x0 < 75 && anchors[t] === undefined) {
      anchors[t] = w.y;
    }
  }
  const missing = ROW_LABELS.filter(l => anchors[l] === undefined);
  if (missing.length) {
    throw new Error('표에서 다음 직종 항목을 찾을 수 없습니다: ' + missing.join(', '));
  }

  // sort anchors by y to build row bands (works regardless of axis direction)
  const sortedAnchors = Object.entries(anchors).sort((a, b) => b[1] - a[1]);
  const bands = {};
  for (let i = 0; i < sortedAnchors.length; i++) {
    const [label, y] = sortedAnchors[i];
    const upper = i === 0 ? y + 40 : (y + sortedAnchors[i - 1][1]) / 2;
    const lower = i === sortedAnchors.length - 1 ? y - 40 : (y + sortedAnchors[i + 1][1]) / 2;
    bands[label] = [Math.min(upper, lower), Math.max(upper, lower)];
  }

  // column x1-boundaries within 지급내역 (payment section), derived from this template's layout
  const COL = {
    overtime: [239.0, 295.2],   // 초과근무 / 초과강의료
    total:    [428.0, 498.2]    // 지급합계
  };

  const numRe = /^-?[\d,]+$/;

  function valuesInBand(label, [xa, xb]) {
    const [ya, yb] = bands[label];
    return words
      .filter(w => numRe.test(w.text.replace(/\s+/g,'')) && w.x1 > xa && w.x1 <= xb && w.y >= ya && w.y <= yb)
      .sort((a, b) => b.y - a.y)
      .map(w => parseInt(w.text.replace(/[^\d-]/g, ''), 10));
  }

  const rows = {};
  for (const label of ROW_LABELS) {
    const ot = valuesInBand(label, COL.overtime);   // [초과근무, 초과강의료]
    const tot = valuesInBand(label, COL.total);     // [지급합계]
    if (tot.length === 0) {
      throw new Error(`"${label}" 행에서 지급합계 값을 찾지 못했습니다. 표 양식이 변경되었을 수 있습니다.`);
    }
    rows[label] = {
      overtime: ot[0] ?? 0,
      overtimeLecture: ot[1] ?? 0,
      total: tot[0]
    };
  }

  return rows;
}

// ---- Compute + render ----
function renderResults(rows){
  const jeonim = rows['전임교원'];
  const chobing = rows['초빙교원'];
  const staffTotal = STAFF_LABELS.reduce((s, l) => s + rows[l].total, 0);
  const staffOvertime = STAFF_LABELS.reduce((s, l) => s + rows[l].overtime, 0);

  const jeonimPay = jeonim.total - jeonim.overtimeLecture;
  const jeonimLecture = jeonim.overtimeLecture;
  const chobingPay = chobing.total;
  const staffPay = staffTotal - staffOvertime;

  metaLine.innerHTML = `
    <span><b>전임교원</b> ${fmt(rows['전임교원'] ? '' : '')}인원 정보 확인됨</span>
    <span>합계 지급합계 <b>${won(rows['합계'].total)}</b></span>
  `;

  const metrics = [
    { label: '전임교원급여', value: jeonimPay, formula: '전임교원 지급합계 − 전임교원 초과강의료' },
    { label: '전임교원 초과강의료', value: jeonimLecture, formula: '전임교원 초과강의료', alt: true },
    { label: '초빙교원급여', value: chobingPay, formula: '초빙교원 지급합계' },
    { label: '직원급여', value: staffPay, formula: '(일반직+기술직+계약직) 지급합계 − 초과근무수당 합' },
    { label: '직원 초과근무수당', value: staffOvertime, formula: '일반직+기술직+계약직 초과근무 합계', alt: true },
  ];

  grid.innerHTML = metrics.map(m => `
    <div class="metric ${m.alt ? 'alt' : ''}">
      <div class="label">${m.label}</div>
      <div class="value">${won(m.value)}</div>
      <div class="formula">${m.formula}</div>
    </div>
  `).join('');

  detailBody.innerHTML = ROW_LABELS.map(label => {
    const r = rows[label];
    const emphasis = label === '합계' ? '' : '';
    return `<tr>
      <td>${label}</td>
      <td>-</td>
      <td>${fmt(r.overtime)}</td>
      <td>${fmt(r.overtimeLecture)}</td>
      <td>${fmt(r.total)}</td>
    </tr>`;
  }).join('');

  resultsEl.classList.add('show');
}

function fmt(n){ return Number(n).toLocaleString('ko-KR'); }
function won(n){ return `${fmt(n)}<span class="won">원</span>`; }
</script>
</body>
</html>
